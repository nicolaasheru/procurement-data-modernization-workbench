name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q --ignore=backend/tests/test_retrieval_integration.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - name: Validate Railway infrastructure definition
        run: npx tsc --noEmit .railway/railway.ts --module nodenext --moduleResolution nodenext --target es2022 --skipLibCheck
      - run: npm test

  pgvector-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: procurement
          POSTGRES_USER: procurement
          POSTGRES_PASSWORD: procurement_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U procurement -d procurement"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://procurement:procurement_ci@localhost:5432/procurement
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_DIMENSIONS: "384"
      RETRIEVAL_MINIMUM_SCORE: "0.25"
      RUN_PGVECTOR_INTEGRATION: "1"
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: hf-all-MiniLM-L6-v2-v1
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q backend/tests/test_retrieval_integration.py

  backend-container:
    runs-on: ubuntu-latest
    needs: [backend, pgvector-integration]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t procurement-workbench-backend:ci .
