services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: procurement
      POSTGRES_USER: procurement
      POSTGRES_PASSWORD: procurement_local
    ports:
      - "5432:5432"
    volumes:
      - procurement_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurement -d procurement"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  procurement_pgdata:
